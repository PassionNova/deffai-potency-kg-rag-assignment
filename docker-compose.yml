services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: potency_owner
      POSTGRES_PASSWORD: potency_owner_dev
      POSTGRES_DB: potency
    ports:
      - "55433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U potency_owner -d potency"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata: {}
